version: "2"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - gochecknoglobals
    - mnd
    - testpackage
    - wrapcheck
  settings:
    gomoddirectives:
      # Load-bearing SDK workaround (packer-plugin-sdk issue 187); must be allowed.
      replace-allow-list:
        - github.com/zclconf/go-cty
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - err113
          - errcheck
          - forcetypeassert
          - gosec
          - noinlineerr
          - varnamelen
